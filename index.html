<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Siempre en modo claro: evita que Android oscurezca la página */
  :root { color-scheme: only light; }
  html, body { background-color: #fff; }
  :root {
    --rol: #006C67; --rol-texto: #ffffff; --rol-suave: #ddefee; --rol-oscuro: #004a46;
    --texto: #1f2933; --texto-2: #5b6670; --texto-3: #9aa5b1;
    --borde: #e3e7ec; --campo: #cbd2d9; --gris: #f3f5f8;
    --rojo: #C70627; --rojo-suave: #fdebee; --rojo-oscuro: #a3051f;
    --verde: #0a7a4b; --verde-suave: #e3f8ee;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Lato', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; background: var(--gris); color: var(--texto); -webkit-tap-highlight-color: transparent; font-size: 16px; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  .pantalla { display: none; max-width: 460px; margin: 0 auto; min-height: 100vh; background: #fff; }
  .pantalla.activa { display: block; }
  .contenido { padding: 18px 16px 26px; }
  .btn { width: 100%; border: none; border-radius: var(--radio); padding: 15px; font-size: 1.08rem; font-weight: 700; background: var(--rol); color: var(--rol-texto); box-shadow: 0 4px 12px rgba(0, 0, 0, .12); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-sec { background: none; border: none; color: var(--texto-2); text-decoration: underline; font-size: .9rem; font-weight: 700; padding: 10px; width: 100%; }
  .error { color: var(--rojo); font-size: .9rem; font-weight: 700; margin: 10px 0 0; text-align: center; min-height: 1em; }
  .dibujo svg { display: block; width: 100%; height: 100%; }

  /* ---------- Pantalla "Escaneá el QR" ---------- */
  #pQR .contenido { padding: 56px 24px 30px; text-align: center; }
  .qr-ico { width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 26px; background: var(--gris); padding: 20px; color: var(--texto); }
  h1 { font-size: 1.5rem; font-weight: 900; margin: 0 0 8px; }
  .sub { color: var(--texto-2); margin: 0 auto; font-weight: 400; line-height: 1.5; max-width: 320px; }
  .caja-error { background: var(--rojo-suave); color: var(--rojo-oscuro); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: .95rem; margin: 0 auto 22px; max-width: 340px; display: none; }
  .aviso { background: #fff6e0; color: #7a5200; border-radius: 12px; padding: 11px 12px; font-size: .88rem; font-weight: 700; margin: 0 0 14px; display: none; }

  /* ---------- Juego ---------- */
  .cabecera { background: var(--rol); color: var(--rol-texto); padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  .cabecera .avatar { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, .2); padding: 6px; flex: none; }
  .cabecera .rol { font-size: 1.3rem; font-weight: 900; margin: 0; line-height: 1.1; }
  .cabecera .grupo { font-size: .9rem; font-weight: 700; margin: 0; opacity: .85; }
  .pill-semana { margin-left: auto; background: #fff; color: var(--texto); border-radius: 999px; padding: 6px 13px; font-weight: 900; font-size: .95rem; white-space: nowrap; }

  .menu { background: var(--gris); border-radius: var(--radio); overflow: hidden; }
  .menu details + details { border-top: 1.5px solid var(--borde); }
  .menu summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 13px 14px; font-weight: 700; cursor: pointer; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary .ico { width: 22px; height: 22px; color: var(--rol-oscuro); flex: none; }
  .menu summary .flecha { margin-left: auto; width: 18px; height: 18px; color: var(--texto-3); transition: transform .2s; flex: none; }
  .menu details[open] summary .flecha { transform: rotate(90deg); }
  .contador { background: var(--rol-suave); color: var(--rol-oscuro); border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 700; }
  .det-cuerpo { padding: 0 14px 12px; font-size: .92rem; line-height: 1.5; }
  .det-cuerpo ul { padding-left: 18px; margin: 6px 0; }
  .det-cuerpo p { margin: 8px 0 4px; }
  .tag { display: inline-block; background: #fff; border: 1.5px solid var(--borde); color: var(--texto); border-radius: 6px; padding: 0 5px; font-size: .74rem; font-weight: 700; letter-spacing: .02em; line-height: 1.55; white-space: nowrap; }

  .check { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1.5px solid var(--borde); cursor: pointer; }
  .check:last-child { border-bottom: none; }
  .check input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 0; border: 2px solid var(--texto-3); border-radius: 8px; background: #fff; display: grid; place-content: center; cursor: pointer; }
  .check input:checked { background: var(--rol); border-color: var(--rol); }
  .check input:checked::after { content: "✓"; color: var(--rol-texto); font-weight: 900; font-size: 15px; line-height: 1; }
  .check .paso { font-size: .92rem; line-height: 1.45; }
  .check .paso b { display: block; font-size: .98rem; font-weight: 700; margin-bottom: 1px; }
  .check.hecho .paso { opacity: .45; }
  .check ul { margin: 2px 0 0; padding-left: 16px; }

  .metricas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 6px; }
  .metrica { border-radius: var(--radio); padding: 11px 13px; background: var(--gris); }
  .metrica p { margin: 0; }
  .metrica .m-et { font-size: .8rem; font-weight: 700; color: var(--texto-2); }
  .metrica .m-val { font-size: 1.6rem; font-weight: 900; line-height: 1.2; }
  .metrica.deuda { background: var(--rojo-suave); }
  .metrica.deuda .m-et, .metrica.deuda .m-val { color: var(--rojo-oscuro); }
  .metrica.sin-deuda { background: var(--verde-suave); }
  .metrica.costo { background: var(--rol); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .metrica.costo .m-et, .metrica.costo .m-val { color: var(--rol-texto); }
  .metrica.sin-deuda .m-et, .metrica.sin-deuda .m-val { color: var(--verde); }

  .campo { margin-top: 16px; }
  .campo label { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: .98rem; }
  .campo .ico-campo { width: 30px; height: 30px; border-radius: 10px; padding: 5px; flex: none; }
  .campo label + input { margin-top: 8px; }
  .campo .pista { font-size: .82rem; color: var(--texto-2); font-weight: 400; margin: 2px 0 7px 39px; }
  .campo input { display: block; width: calc(100% - 39px); margin-left: 39px; padding: 13px 14px; border: 2px solid var(--campo); border-radius: var(--radio); font-family: inherit; font-size: 20px; font-weight: 700; color: var(--texto); background: #fff; }
  .campo input:focus { outline: none; border-color: var(--rol); box-shadow: 0 0 0 4px var(--rol-suave); }
  .campo input::-webkit-outer-spin-button, .campo input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .campo input[type=number] { -moz-appearance: textfield; }
  .campo input:disabled, .campo input[readonly] { background: var(--gris); border-style: dashed; color: var(--texto); -webkit-text-fill-color: var(--texto); opacity: 1; }
  .campo input:disabled::placeholder { color: var(--texto-3); font-size: 15px; font-weight: 700; }
  .campo .nota-campo { display: none; margin: 6px 0 0 39px; font-size: .82rem; font-weight: 700; color: var(--texto-2); }
  .campo.bloqueado .nota-campo { display: block; }
  .campo.con-error input { border-color: var(--rojo); box-shadow: 0 0 0 4px var(--rojo-suave); }
  .err-campo { display: none; color: var(--rojo); font-size: .85rem; font-weight: 700; margin: 6px 0 0 39px; }
  .campo.con-error .err-campo { display: block; }
  .acciones { margin-top: 20px; }

  /* ---------- Popup del paso ---------- */
  .modal.paso { background: #fff; padding: 0; overflow: hidden; text-align: left; }
  .modal.paso .cab-paso { background: var(--rol); color: var(--rol-texto); padding: 16px 18px; text-align: center; }
  .modal.paso .cab-paso .sup { font-size: .78rem; font-weight: 900; letter-spacing: .06em; opacity: .85; }
  .modal.paso .cab-paso h2 { margin: 2px 0 0; font-size: 1.5rem; }
  .modal.paso .cuerpo-paso { padding: 16px 18px 18px; font-size: 1.02rem; line-height: 1.5; font-weight: 400; color: var(--texto); }
  .modal.paso .cuerpo-paso ul { margin: 0; padding-left: 18px; }
  .modal.paso .cuerpo-paso li + li { margin-top: 6px; }
  .modal.paso .pie-paso { margin-top: 16px; padding-top: 12px; border-top: 1.5px solid var(--borde); color: var(--texto-3); font-size: .85rem; font-weight: 700; text-align: center; }

  /* ---------- Instrucciones con tarjetas del tablero ---------- */
  .instr { display: flex; gap: 10px; align-items: flex-start; }
  .instr .num-paso { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--rol); color: var(--rol-texto); display: grid; place-content: center; font-weight: 900; font-size: 1rem; margin-top: 8px; }
  .instr .linea { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; font-size: .98rem; color: #575757; line-height: 1.3; }
  .tarj { display: inline-flex; align-items: stretch; border-radius: 6px; font-family: 'Montserrat', 'Lato', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 11.5px; line-height: 1.2; letter-spacing: .01em; }
  .tarj .lbl { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 6px; white-space: nowrap; }
  .tarj .ficha { position: relative; width: 40px; flex: none; border-radius: 4px; margin: 5px; min-height: 42px; }
  .tarj .ficha .letra { position: absolute; top: 0; left: 3px; font-size: 17px; font-weight: 700; line-height: 1; }
  .tarj .ficha svg { position: absolute; right: 3px; bottom: 3px; width: 28px; height: 22px; }
  .tarj.llena { color: #FBF2E4; }
  .tarj.llena { width: 160px; }
  .tarj.llena .lbl { flex: 1; }
  .tarj.llena .ficha { background: #FBF2E4; }
  .tarj.crema { background: #FBF2E4; border: 1.5px solid; }
  .tarj.crema .ficha { order: -1; }
  .tarj.crema .ficha .letra { color: #FBF2E4; }
  .tarj.crema { width: 196px; }
  .tarj.crema .lbl { flex: 1; }
  .tarj.oc { width: 160px; flex-direction: column; align-items: center; padding: 7px 10px 8px; gap: 4px; }
  .tarj.oc svg { width: 20px; height: 24px; }
  .ok-entrega { display: inline-flex; align-items: center; gap: 6px; background: var(--verde-suave); color: var(--verde); border-radius: 999px; padding: 5px 13px 5px 6px; font-weight: 900; font-size: .9rem; margin-bottom: 12px; }
  .ok-entrega span { width: 22px; height: 22px; border-radius: 50%; background: var(--verde); color: #fff; display: grid; place-content: center; font-size: 13px; }
  .instr-espera { background: #fff; color: var(--texto); border-radius: 14px; padding: 12px; margin-top: 14px; text-align: left; }
  .instr-espera .sup { font-size: .74rem; font-weight: 900; color: var(--texto-2); letter-spacing: .06em; margin: 0 0 8px; }
  .tarjeta-paso6 { background: #fff; border: 2px solid var(--rol-suave); border-radius: var(--radio); padding: 12px; margin-top: 16px; }
  .tarjeta-paso6 .sup { font-size: .74rem; font-weight: 900; color: var(--rol-oscuro); letter-spacing: .06em; margin: 0 0 8px; }

  /* ---------- Costo acumulado bien visible en los popups ---------- */
  .costo-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--rol); color: var(--rol-texto); border-radius: 14px; padding: 10px 16px; margin: 0 0 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .costo-banner .et { font-size: .78rem; font-weight: 900; letter-spacing: .06em; line-height: 1.2; text-align: left; opacity: .92; }
  .costo-banner .val { font-size: 2.1rem; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .modal.listo .costo-banner, .modal.espera .costo-banner { margin: 16px 0 0; }

  /* ---------- Hoja de confirmación ---------- */
  .velo { position: fixed; inset: 0; background: rgba(15, 23, 32, .6); display: none; z-index: 40; }
  .velo.visible { display: flex; }
  #velConfirmar { align-items: flex-end; justify-content: center; }
  .hoja { background: #fff; width: 100%; max-width: 460px; border-radius: 22px 22px 0 0; padding: 22px 18px 20px; animation: subir .22s ease-out; }
  @keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .hoja h2 { margin: 0; font-size: 1.3rem; font-weight: 900; }
  .hoja .sub2 { margin: 2px 0 12px; color: var(--texto-2); font-size: .9rem; font-weight: 400; }
  .fila-conf { display: flex; align-items: center; gap: 10px; background: var(--gris); border-radius: var(--radio); padding: 10px 14px; margin-top: 8px; font-weight: 700; font-size: .95rem; }
  .fila-conf .ico-campo { width: 30px; height: 30px; border-radius: 10px; padding: 5px; flex: none; }
  .fila-conf b { margin-left: auto; font-size: 1.7rem; font-weight: 900; }
  .botones-conf { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-top: 16px; }
  .btn-borde { border: 2px solid var(--campo); background: #fff; border-radius: var(--radio); padding: 13px; font-size: 1.02rem; font-weight: 700; }

  /* ---------- Popup de espera ---------- */
  #overlay { align-items: center; justify-content: center; padding: 20px; z-index: 50; background: rgba(15, 23, 32, .72); }
  .modal { border-radius: 22px; padding: 28px 22px 20px; width: 100%; max-width: 360px; text-align: center; animation: entrar .25s ease-out; }
  @keyframes entrar { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes latir { 50% { transform: scale(1.08); } }
  .modal .icono { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-content: center; font-size: 38px; }
  .modal h2 { font-size: 1.7rem; font-weight: 900; margin: 0 0 6px; }
  .modal p { margin: 0; }
  .modal.espera { background: var(--rojo); color: #fff; }
  .modal.espera .icono { background: #fff; animation: latir 1.6s ease-in-out infinite; }
  .modal.espera .texto { font-size: 1.08rem; font-weight: 700; }
  .ok-envio { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--verde); border-radius: 999px; padding: 5px 13px 5px 6px; font-weight: 900; font-size: .92rem; margin-bottom: 14px; }
  .ok-envio span { width: 22px; height: 22px; border-radius: 50%; background: var(--verde); color: #fff; display: grid; place-content: center; font-size: 13px; }
  .modal.espera .verificando { color: #ffd2d9; font-size: .85rem; font-weight: 400; margin-top: 14px; }
  .modal.espera .btn-sec { color: #fff; }
  .modal.listo { background: #fff; border: 4px solid var(--rol); }
  .modal.listo .icono { background: #009639; color: #fff; animation: latir 1s ease-in-out infinite; }
  .modal.listo p { color: var(--texto-2); font-weight: 400; margin-bottom: 18px; }

  .marca { text-align: center; margin-top: 22px; padding: 4px 0 0; }
  .marca img { width: 78px; height: auto; display: inline-block; }
  #pQR.activa .contenido { min-height: 100vh; display: flex; flex-direction: column; }
  #pQR .marca { margin-top: auto; padding: 32px 0 6px; }
  #pQR .marca img { width: 70px; }
  .cargando { text-align: center; padding: 90px 20px; color: var(--texto-2); font-weight: 700; }

  /* ---------- Imagen de fondo de cada rol ---------- */
  .fondo { display: none; position: fixed; inset: 0; z-index: 0; background: #2b3138 center / cover no-repeat; pointer-events: none; }
  .fondo::after { content: ""; position: absolute; inset: 0; background: rgba(15, 23, 32, .22); }
  body.con-fondo { background: #2b3138; }
  body.con-fondo .fondo { display: block; }
  body.con-fondo #pJuego { position: relative; z-index: 1; width: calc(100% - 44px); max-width: 380px; min-height: 0; margin: 22px auto 30px; border-radius: 24px; box-shadow: 0 14px 40px rgba(0, 0, 0, .35); }
  body.con-fondo #pJuego .cabecera { border-radius: 24px 24px 0 0; }
  body.con-fondo #pJuego .contenido { padding: 16px 14px 22px; border-radius: 0 0 24px 24px; }
  @media (max-width: 360px) { body.con-fondo #pJuego { width: calc(100% - 32px); margin-top: 14px; } }
</style>
</head>
<body>

<!-- ============ FONDOS ILUSTRADOS ============ -->
<div class="fondo" id="fondo" aria-hidden="true"></div>

<!-- ============ CARGANDO ============ -->
<div id="pCargando" class="pantalla activa"><div class="cargando">Cargando…</div></div>

<!-- ============ ESCANEÁ EL QR ============ -->
<div id="pQR" class="pantalla">
  <div class="contenido">
    <div class="caja-error" id="errQR"></div>
    <div class="qr-ico" id="icoQR"></div>

function al(nombre) { return nombre === "Fábrica" ? "a la" : "al"; }
function del(nombre) { return nombre === "Fábrica" ? "de la" : "del"; }
function tag(t) { return '<span class="tag">' + t + '</span>'; }

// Pasos del checklist según el rol (textos del PDF y de la carta "Modo de uso")
function pasosChecklist(rol, deuda) {
  var r = ROLES[rol], cli = r.cliente.toLowerCase(), prov = r.proveedor;
  var pasos = [];
  if (rol === "Fábrica") {
    pasos.push({ t: "Recibir", d: "<ul><li>Recibir " + tag("PRODUCTOS TERMINADOS") + " al depósito.</li><li>Mover " + tag("PRODUCTOS EN PRODUCCIÓN") + " a " + tag("PRODUCTOS TERMINADOS") + ".</li></ul>" });
  } else {
    pasos.push({ t: "Recibir", d: "<ul><li>Mover " + tag("ENTREGAS POR LLEGAR") + " al depósito.</li><li>Mover " + tag("ENTREGADO A TRANSPORTE") + " a " + tag("ENTREGAS POR LLEGAR") + ".</li></ul>" });
  }
  pasos.push({ t: "Leer la solicitud", d: "Leer la carta de " + tag("SOLICITUD RECIBIDA") + " " + del(r.cliente) + " " + cli + " y colocarla debajo del tablero, por el borde superior." });
  if (rol === "Fábrica") {
    pasos.push({ t: "Avanzar tu pedido", d: "Avanzar tu carta de " + tag("PEDIDO REALIZADO") + " a producción." });
  } else {
    pasos.push({ t: "Avanzar tu pedido", d: "Avanzar tu carta de " + tag("PEDIDO REALIZADO") + " a " + tag("SOLICITUD RECIBIDA") + " " + del(prov) + " " + prov.toLowerCase() + "." });
  }
  var destino = rol === "Minorista" ? "Entregar las cajas al cliente final" : "Colocar cajas en " + tag("ENTREGADO A TRANSPORTE");
  pasos.push({ t: "Entregar", d: destino + ": entregá todo lo que puedas, la solicitud de esta semana" +
    (deuda > 0 ? " + tu deuda (<b style='display:inline'>" + deuda + "</b>)." : ".") + " Registrar en la app la entrega." });
  pasos.push({ t: "Pedir", d: "Recuperar la carta de debajo del tablero, escribir otra cantidad y ponerla en " + tag("PEDIDO REALIZADO") + "." });
  pasos.push({ t: "Registrar", d: "Registrar en la app el pedido." });
  return pasos;
}

function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function leerLocal(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function borrarLocal(k) { try { localStorage.removeItem(k); } catch (e) {} }
function $(id) { return document.getElementById(id); }

function idDispositivo() {

var API_URL = "https://script.google.com/macros/s/AKfycbyFQbM01T28lywsRapijTMtAMwpuYr7H_iyERh4Goat68o32hZEIxLWSp5TOTIx7lfyPw/exec";
// Dentro de Apps Script se usa google.script.run; desde GitHub Pages, la API por POST
var EN_APPS_SCRIPT = typeof google !== "undefined" && google.script && google.script.run;

function servidor(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (EN_APPS_SCRIPT) {
    return new Promise(function (ok, mal) {
      var run = google.script.run.withSuccessHandler(ok).withFailureHandler(mal);
      run[fn].apply(run, args);
    });
  }
  // Sin cookies de Google: el pedido va como texto simple y sin sesión
  return fetch(API_URL, { method: "POST", body: JSON.stringify({ fn: fn, args: args }), credentials: "omit", redirect: "follow" })
    .then(function (r) {
      if (!r.ok) throw new Error("No hay conexión con el servidor. Probá de nuevo.");
      return r;
    }, function () { throw new Error("No hay conexión con el servidor. Probá de nuevo."); })
    .then(function (r) {
      return r.json();
    })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      return d.ok;
    });
}

// Lee los datos del QR que vienen en el link (?g=2&r=mayorista)
function leerQR(listo) {
  if (!EN_APPS_SCRIPT) {
    var q = new URLSearchParams(location.search), g = q.get("g"), r = q.get("r");
    listo(g && r ? { g: String(g), r: String(r).toLowerCase() } : null);
    return;
  }
  try {
    google.script.url.getLocation(function (loc) {
      var p = (loc && loc.parameter) || {};
      listo(p.g && p.r ? { g: String(p.g), r: String(p.r).toLowerCase() } : null);
    });
  } catch (e) { listo(null); }
}

function arrancar(qr) {
  yo = leerLocal(CLAVE + "_yo");
  if (yo && yo.grupo && yo.rol) {
    // Este celular ya tiene mesa y rol: se mantienen aunque escanee otro QR
    yo.dispositivo = idDispositivo();
    iniciarJuego(qr && !(qr.g === yo.g && qr.r === yo.r));
  } else if (qr) {
    tomarLugarQR(qr);
  } else {
    mostrarPantallaQR("");
  }
}

function tomarLugarQR(qr) {

    yo = { grupo: d.grupo, rol: d.rol, dispositivo: disp, g: qr.g, r: qr.r };
    guardarLocal(CLAVE + "_yo", { grupo: yo.grupo, rol: yo.rol, g: qr.g, r: qr.r });

function iniciarJuego(otroQR) {

function refrescarEstado() {
  return servidor("obtenerEstado", yo.grupo, yo.rol, yo.dispositivo).then(function (e) {
    if (!e.lugarValido) { lugarLiberado(); return null; }
    estado = e;
    juego = { semana: e.semanaHabilitada, paso: e.paso };
    return e;
  }).catch(function () {
    document.querySelector("#pCargando .cargando").innerHTML = 'No se pudo conectar. <br><button class="btn-sec" onclick="iniciarJuego()">Reintentar</button>';
    return null;
  });

  var id = etapa === "pedido" ? "pedido" : "entregado";

  if (v === "") { marcarError(id, "Completá este número (si es ninguno, poné 0)."); return; }
  if (!/^\d+$/.test(v)) { marcarError(id, "Usá un número entero, sin decimales ni signos."); return; }

  pendiente = { etapa: etapa, valor: v };
  var r = ROLES[yo.rol];
  var esEntrega = etapa !== "pedido";
  $("confLbl1").textContent = esEntrega ? textoEntregado() : textoPedido();
  $("confVal1").textContent = Number(v);

  el.innerHTML = ICONOS[esEntrega ? "entregar" : "pedir"];

function enviarJugada() {
  if (!pendiente) return;
  cerrarConfirmacion();
  prepararAudio(); // el navegador sólo deja sonar el aviso si se activa con un toque
  var btn = $("btnEnviar"), textoBtn = btn.textContent;
  btn.disabled = true; btn.textContent = "Guardando…";
  var jugada = pendiente, esEntrega = jugada.etapa !== "pedido";
  var datos = { grupo: yo.grupo, rol: yo.rol, dispositivo: yo.dispositivo };
  if (esEntrega) datos.entregado = jugada.valor; else datos.pedido = jugada.valor;

  servidor(esEntrega ? "registrarEntrega" : "registrarPedido", datos)
    .then(function (res) {
      pendiente = null;
      btn.disabled = false; btn.textContent = textoBtn;
      if (esEntrega) {
        estado.entregaRegistrada = true;
        estado.entregadoSemana = res.entregado;
        actualizarFase(false);
      } else {
        $("entregado").value = ""; $("pedido").value = "";
        estado.ultimaSemana = res.semana; estado.semana = res.semana + 1;
        estado.entregaRegistrada = false; estado.entregadoSemana = null;
        etapa = null;
        actualizarFase(false, res.semana);
      }
    })
    .catch(function (e) {
      btn.disabled = false; btn.textContent = textoBtn;
      if (e.message.indexOf("LUGAR_LIBERADO") !== -1) { lugarLiberado(); return; }
      if (e.message.indexOf("No tenés tantas cajas") !== -1) { marcarError("entregado", e.message); $("entregado").focus(); return; }
      if (e.message.indexOf("Ya registraste la entrega") !== -1) { refrescarEstado().then(function () { actualizarFase(false); }); return; }
      $("errJuego").textContent = e.message;
    });
}


// =====================================================================
//  FASES: esperando semana / jugando la semana (pasos del facilitador)
// =====================================================================
// Decide qué mostrar según la semana del jugador y lo que maneja el facilitador.
// conAviso: vibra y suena si aparece un paso nuevo. recienEnviada: número de semana que se acaba de enviar.
function actualizarFase(conAviso, recienEnviada) {
  if (!estado || !juego) return;
  var esperando = estado.semana > juego.semana;
  var atrasado = estado.semana < juego.semana;   // le faltan semanas por enviar
  var yaEnvio = juego.semana > 0 && estado.ultimaSemana === juego.semana;
  var entrega = !!estado.entregaRegistrada;

  if (esperando) {
    $("zonaForm").style.display = "none";
    if (yaEnvio) {
      mostrarConfirmacion("¡Semana " + juego.semana + " enviada!");
    } else {
      abrirEspera(recienEnviada || estado.ultimaSemana);
    }
    return;
  }
  // Qué toca registrar: la entrega desde el paso 4, el pedido en el paso 6
  var et = null;
  if (atrasado || juego.paso >= 6) et = entrega ? "pedido" : "entrega";
  else if (juego.paso >= 4 && !entrega) et = "entrega";
  if (et) { mostrarFormulario(et, conAviso, atrasado); return; }

  $("zonaForm").style.display = "none";
  if (juego.paso === 4 && entrega) {
    mostrarConfirmacion("¡Entrega registrada!");
    return;
  }
  // Popup fijo con la instrucción del paso
  mostrarPopupPaso();
  if (conAviso) avisar();
}

// Mismo formulario en los pasos 4 y 6: se habilita el campo que corresponde
function mostrarFormulario(et, conAviso, atrasado) {
  var estabaCerrado = !$("overlay").classList.contains("visible");
  var cambio = etapa !== et;
  etapa = et;
  var esEntrega = et === "entrega";
  var ent = $("entregado"), ped = $("pedido");

  ent.readOnly = !esEntrega;
  ped.disabled = esEntrega;
  $("campoEntregado").classList.toggle("bloqueado", !esEntrega);
  $("campoPedido").classList.toggle("bloqueado", esEntrega);
  // Solo se muestra el campo del paso actual: entrega en el 4, pedido en el 6
  $("campoEntregado").style.display = esEntrega ? "" : "none";
  $("campoPedido").style.display = esEntrega ? "none" : "";
  if (esEntrega) {
    if (cambio) ent.value = "";
    ped.value = ""; ped.placeholder = "";
    $("notaPedido").textContent = "🔒 Se registra en el paso 6";
  } else {
    ent.value = estado.entregadoSemana != null ? estado.entregadoSemana : "";
    $("notaEntregado").textContent = "🔒 Registrado en el paso 4";
    ped.placeholder = "";
  }
  $("btnEnviar").textContent = esEntrega ? "Registrar entrega" : "Registrar pedido";
  if (cambio) { $("errJuego").textContent = ""; limpiarError("entregado"); limpiarError("pedido"); }

  // Instrucción del paso que se está registrando
  var t = $("tarjetaPaso6"), n = pasoLocal(yo.rol, esEntrega ? 4 : 6);
  if (INSTRUCCIONES[yo.rol] && !atrasado && n) {
    t.innerHTML = '<p class="sup">PASO ' + n + ' DE ' + totalPasos(yo.rol) + '</p>' + htmlInstruccion(yo.rol, n);
    t.style.display = "block";
  } else {
    t.style.display = "none";
  }
  $("zonaForm").style.display = "block";
  cerrarPopup();
  if (conAviso && (!estabaCerrado || cambio)) {
    avisar();
    setTimeout(function () { $("zonaForm").scrollIntoView({ behavior: "smooth", block: "start" }); }, 150);
  }
}

// ---------- Consulta periódica de lo que hace el facilitador ----------
function iniciarPolling() {
  detenerPolling();
  timerPolling = setInterval(consultarJuego, 4000);
}
function detenerPolling() { if (timerPolling) { clearInterval(timerPolling); timerPolling = null; } }

var consultando = false;
function consultarJuego() {
  if (consultando || !yo) return Promise.resolve();
  consultando = true;
  return servidor("estadoJuego").then(function (j) {
    var antes = juego;
    juego = j;
    var cambioSemana = !antes || j.semana !== antes.semana;
    var cambioPaso = !antes || j.paso !== antes.paso;
    if (cambioSemana) {
      // Semana nueva: se recargan deuda y costo antes de mostrar el paso
      return refrescarEstado().then(function (e) {
        if (!e) return;
        dibujarJuego();
        actualizarFase(true);
      });
    }
    if (cambioPaso) actualizarFase(true);
  }).catch(function () { /* se reintenta en el próximo ciclo */ })
    .then(function () { consultando = false; });
}

function verificarAhora() {
  var t = $("txtVerificando");
  if (t) t.textContent = "Verificando…";
  consultarJuego().then(function () {
    var t2 = $("txtVerificando");
    if (t2) t2.textContent = "Todavía no está habilitada. Se actualiza solo.";
  });
}

function cerrarPopup() { $("overlay").classList.remove("visible"); }

// Si el celular se bloquea, al volver se consulta enseguida
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && timerPolling) consultarJuego();
});

// ---------- Sonido ----------
function prepararAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function sonarAviso() {
  try {
    if (!audioCtx) return;
    [0, 0.18].forEach(function (t, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i ? 1046 : 784;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.17);
    });
  } catch (e) {}
}
</script>
